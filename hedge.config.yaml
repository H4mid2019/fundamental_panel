  - SMCI

# Context-only series: quoted for the top bar and the tail-hedge composite, but
# never scanned for option setups.
context:
  # VIX term structure. These are *indices*, not futures — Yahoo quotes all four,
  # which gives a term-structure slope for free (no futures feed required).
  vixTerm: ["^VIX9D", "^VIX", "^VIX3M", "^VIX6M"]
  # 10-year Treasury yield.
  rates: ["^TNX"]
  # The correlation benchmark every ticker is measured against.
  benchmark: SPY
  # Underlyings used for the tail-hedge monitor's cheap far-OTM put spreads.
  tailHedgeUnderlyings: ["SPY", "^SPX"]

# ── Scan schedule ─────────────────────────────────────────────────────────────
# Weekdays, 30 min after the US open and 30 min before the close. Cron runs in
# `timezone`, so DST is handled for you — do not hardcode UTC offsets here.
schedule:
  enabled: true
  timezone: America/New_York
  crons:
    - "0 10 * * 1-5" # 10:00 ET — 30 min after the open
    - "30 15 * * 1-5" # 15:30 ET — 30 min before the close

# ── Chain fetching ────────────────────────────────────────────────────────────
# Yahoo returns ONE expiration's chain per HTTP call, so the tenor list below is
# the per-ticker call budget. Keep it small: universe × tenors = calls per scan.
chain:
  # Two tenor lists, because the wings and the at-the-money point have different
  # requirements.
  tenors:
    # `skew` tenors resolve to standard monthlies (3rd Friday) ONLY. A 25-delta
    # strike needs a deep strike ladder, and a weekly's is far too shallow:
    # AAPL's 8/14 weekly listed strikes 200-335 while the 8/21 monthly listed
    # 110-600. A 25-delta search on the weekly silently clamps to the edge of
    # the ladder, making every skew number quietly wrong rather than absent.
    skew: [30, 60, 90, 180]
    # `term` tenors may resolve to ANY expiration, weeklies included — ATM
    # strikes are listed on every expiry, so ATM IV is safe there. This exists
    # to bracket the 30-day point from below: without a sub-30-DTE expiry, a
    # constant-maturity 30d ATM IV (which VRP is defined against) could only be
    # extrapolated, and extrapolating it is not allowed.
    term: [14]
  # Never select an expiration closer than this (gamma/pin noise, garbage IV).
  # Must stay below 30 or nothing can bracket the 30-day point.
  minDte: 10
  # Concurrent Yahoo requests. Yahoo will 429 an aggressive scan; 3 is polite.
  concurrency: 3
  # Random jitter (ms) added between requests to avoid a synchronized burst.
  jitterMs: [120, 400]
  # Retries per request with exponential backoff, for 429s and transient 5xxs.
  maxRetries: 3
  # Server-side cache TTL for a fetched chain, so a manual re-scan minutes after
  # a cron scan does not re-hammer Yahoo.
  cacheTtlSeconds: 600
  # Contract hygiene. Contracts failing these are excluded from metrics (they
  # are still kept in the raw snapshot, which is stored verbatim).
  quality:
    # Drop contracts with no two-sided market.
    requireTwoSidedQuote: true
    # Drop contracts whose bid/ask is wider than this fraction of the mid.
    maxRelativeSpread: 1.0
    # Drop implied vols outside this band as unphysical.
    minIv: 0.01
    maxIv: 5.0

# ── Metrics ───────────────────────────────────────────────────────────────────
metrics:
  # Trailing window for IV rank / IV percentile.
  ivRankLookbackDays: 252
  # Below this many *real* (non-proxied) IV observations, IV rank is computed
  # from realized-volatility rank instead and flagged `proxied` everywhere it is
  # surfaced — in the API payload, on the heatmap and on every affected setup.
  ivRankMinRealDays: 60
  # Rolling window for the put-skew / call-put-spread / term-slope z-scores.
  skewZLookbackDays: 120
  # Rolling correlation window, and the multi-year band a correlation must break
  # out of to count as a regime change.
  correlationWindowDays: 60
  correlationRegimeLookbackDays: 756
  # Realized-vol window used for price context.
  realizedVolWindowDays: 20

  # Risk-free rate for Black-Scholes. `irx` reads the 13-week T-bill (^IRX),
  # quoted in percent and divided by 100. That is the right maturity for option
  # tenors — ^TNX is the 10-year and is simply the wrong point on the curve.
  # When the rate is unavailable the scan does not stop: it falls back to
  # `fallbackRate`, logs a warning, and flags every affected metric row
  # `rates_fallback` so the UI can say the delta used a fallback rate.
  riskFreeRate:
    source: irx
    fallbackRate: 0.042

  # RiskMetrics EWMA decay for the realized-vol forecast. 0.94 is the daily
  # standard; lower reacts faster, higher is smoother.
  ewmaLambda: 0.94

  # Trailing window for the variance-risk-premium z-score.
  vrpLookbackDays: 252

  # Put-call parity data-quality guard. C - P should equal S*e^(-qT) - K*e^(-rT)
  # for the same strike and expiry; a large violation means one leg is stale or
  # crossed. Such rows are EXCLUDED from every metric rather than averaged in.
  parity:
    # Absolute floor in dollars, so a (lying) zero-width market cannot pass with
    # a zero threshold.
    tolerance: 0.05
    # A violation is tolerated up to this multiple of the combined half-spread.
    halfSpreadMult: 2
    # Data-quality badge thresholds, as a fraction of usable contracts.
    # >= goodFraction -> good; >= minGoodFraction -> degraded; below -> poor.
    goodFraction: 0.8
    minGoodFraction: 0.5

# ── Ratio pairs ───────────────────────────────────────────────────────────────
# Rolling z-score of the numerator/denominator close ratio. The two legs may
# trade on different calendars, so the denominator is forward-filled (never zip
# two price series positionally).
pairs:
  lookbackDays: 120

  # Mean-reversion guard (Ornstein-Uhlenbeck half-life, estimated by OLS on
  # Δs_t = a + λ·s_(t−1) + ε, half_life = −ln(2)/λ).
  #
  # A z-score only means "stretched, expect snap-back" if the spread actually
  # mean-reverts. A structurally broken pair — one leg permanently re-rating —
  # diverges forever, and a naive z-score scanner would fade that trend
  # indefinitely, all the way down. Pairs whose λ >= 0 (no reversion) or whose
  # half-life falls outside this band are marked `mean_reversion: fail` and are
  # suppressed from ranking, though still shown with the half-life for context.
  minHalfLife: 1 # below this the "signal" is just noise/microstructure
  maxHalfLife: 60 # trading days; beyond this it is a trend, not a spread

  list:
    - id: gld-gdx
      numerator: GLD
      denominator: GDX
      label: Gold vs Gold Miners
    - id: uso-xle
      numerator: USO
      denominator: XLE
      label: Crude vs Energy Equities
    - id: iwm-spy
      numerator: IWM
      denominator: SPY
      label: Small Caps vs Large Caps
    - id: hyg-tlt
      numerator: HYG
      denominator: TLT
      label: High Yield vs Treasuries
    - id: copper-gld
      numerator: CPER # copper-proxy ETF
      denominator: GLD
      label: Copper vs Gold

# ── Strategy scanners ─────────────────────────────────────────────────────────
scanners:
  # How many ranked setups each scanner keeps per scan.
  topN: 20

  # Variance risk premium: ATM_IV_30d − EWMA_realized_vol, in vol points.
  #
  # This is NOT redundant with IV rank, and the two routinely disagree. IV rank
  # says "cheap versus its own history"; VRP says "cheap versus what volatility
  # is actually doing right now". IV rank can sit in its 10th percentile while
  # realized vol runs *above* implied — options look cheap historically and are
  # in fact underpricing reality. Both are displayed.
  #
  # VRP is also computable from day one, while IV rank is still a realized-vol
  # proxy — so during history accumulation it is the more honest of the two.
  vrp:
    # false: VRP only weights the ranking, and your IV-rank thresholds remain
    #        the sole admission test.
    # true:  VRP additionally EXCLUDES setups on the wrong side of the limits
    #        below. That is a second opinion bolted onto your thresholds, so it
    #        is opt-in rather than silently applied.
    hardGate: false
    maxVrpForProtection: 2.0 # buying protection: want VRP low (cheap vs reality)
    minVrpForSelling: 3.0 # selling premium: want VRP high (options rich)
    rankWeight: 1.0

  protectivePut:
    enabled: true
    # Put protection is cheap: low IV rank AND price above its 200-day MA.
    maxIvRank: 25
    minPctVs200dma: 0
    otmPctRange: [5, 10]
    dteRange: [60, 120]

  putDebitSpread:
    enabled: true
    # Ranked by put-skew steepness — a steep skew makes the short leg rich.
    longStrikeOffsetPct: -5 # buy ~5% below spot
    shortStrikeOffsetPct: -15 # sell ~15% below spot
    dteRange: [45, 120]
    minSkewZ: 0.5

  callCredit:
    enabled: true
    # Rich vol AND a stretched price: sell upside.
    minIvRank: 70
    minPctVs200dma: 8
    shortDeltaRange: [0.20, 0.30]
    wingWidthPct: 5
    dteRange: [30, 60]

  collar:
    enabled: true
    # Ranked by call-minus-put IV spread (richest calls relative to puts).
    shortCallDeltaRange: [0.20, 0.30]
    longPutDeltaRange: [0.20, 0.25]
    dteRange: [90, 365]
    # Penalties (subtracted from the raw score) for real-world frictions.
    penalties:
      earningsInTenor: 1.5
      exDivBeforeExpiry: 1.0 # early-assignment risk on the short call
      wideSpread: 2.0 # bid/ask > `maxRelativeSpreadPct` of mid
      thinOpenInterest: 2.0 # open interest < `minOpenInterest`
    maxRelativeSpreadPct: 10
    minOpenInterest: 500
    # Early assignment on the short call is a real risk only when its remaining
    # extrinsic value is worth less than the dividend the holder captures by
    # exercising early:  extrinsic = callMid − max(0, S − K);  at risk when
    # extrinsic < dividend × exDivBuffer. 1.0 is the textbook boundary; raise it
    # to demand a margin of safety. This drives the `exDivBeforeExpiry` penalty
    # above rather than a parallel one.
    exDivBuffer: 1.0

  tailHedge:
    enabled: true
    # Composite: VIX term slope + credit divergence + SPY put skew. Fires when
    # credit deteriorates while equity vol stays complacent.
    otmPctRange: [15, 30]
    dteRange: [60, 180]
    # Composite score above which the monitor flags cheap far-OTM put spreads.
    minCompositeScore: 1.5

# ── Alerts ────────────────────────────────────────────────────────────────────
alerts:
  # Any tracked z-score crossing this magnitude fires.
  zScoreThreshold: 2.5
  # A scanner's top-ranked setup fires when its score crosses this.
  scannerScoreThreshold: 3.0
  # Term-structure inversion and correlation regime breaks always fire.
  onTermInversion: true
  onCorrelationRegimeBreak: true
  # Do not re-fire the same (ticker, type) alert within this window.
  cooldownDays: 3
  # Alerts derived from a proxied (realized-vol-based) IV rank are still fired,
  # but tagged `proxied` so you know the basis. Set false to suppress them.
  fireOnProxiedIvRank: true

# ── AI interpretation ─────────────────────────────────────────────────────────
ai:
  enabled: true
  # Interpret the top N setups/alerts after each scan. Everything works with no
  # API key set — the deterministic local fallback fills in.
  topN: 5
