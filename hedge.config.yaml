# HedgeScope configuration.
#
# Mounted into the container (see docker-compose.yml), so you can edit the
# universe, schedule and thresholds and restart without a rebuild. Every field
# below is Zod-validated at startup — a malformed value fails fast and loudly
# rather than silently disabling a scanner.
#
# Secrets do NOT belong here. They live in `.env` (HEDGE_SCAN_SECRET,
# SLACK_WEBHOOK_URL, OPENROUTER_API_KEY, ...).

# ── Ticker universe ───────────────────────────────────────────────────────────
# Every symbol is scanned for a full option-chain snapshot. Symbols Yahoo has no
# chain for are skipped with a loud warning; they never abort the scan.
universe:
  # Broad-market index ETFs
  - SPY
  - QQQ
  - IWM
  - DIA
  # Sector / thematic ETFs
  - XLE
  - XLF
  - XLK
  - XLV
  - XLI
  - XLU
  - XLP
  - XLY
  - XLB
  # Commodities, credit, rates, international
  - GLD
  - GDX
  - SLV
  - USO
  - TLT
  - HYG
  - LQD
  - EEM
  - FXI
  # Liquid optionable large caps
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - AVGO
  - BRK-B
  - LLY
  - JPM
  - V
  - MA
  - XOM
  - UNH
  - JNJ
  - PG
  - HD
  - COST
  - ABBV
  - MRK
  - CVX
  - WMT
  - PEP
  - KO
  - ADBE
  - CRM
  - AMD
  - NFLX
  - ORCL
  - CSCO
  - ACN
  - MCD
  - TMO
  - ABT
  - LIN
  - DIS
  - INTC
  - QCOM
