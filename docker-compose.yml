# Fundamental Analysis Dashboard — single-host deployment behind your nginx.
#
#   1. Put your API keys in `.env` (copy from .env.example).
#   2. docker compose up -d --build
#   3. Point nginx at http://127.0.0.1:3500 (see deploy/nginx/fundamental.conf).
#
# The app is bound to 127.0.0.1 only, so it's reachable solely via nginx.
# A bounded Redis is included for caching (keeps cache out of the app's heap).

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      # Use the bundled Redis. Pick the DB index with REDIS_DB in .env (0-15).
      - REDIS_URL=redis://redis:6379/${REDIS_DB:-0}
      # HedgeScope's SQLite lives on the named volume below — see the warning.
      - HEDGE_DB_PATH=/data/hedge.db
      - HEDGE_CONFIG_PATH=/app/hedge.config.yaml
    depends_on:
      - redis
    volumes:
      # ⚠️  REAL STORAGE, NOT A CACHE. This volume holds the accumulated daily
      # IV history that IV rank is computed from — 252 trading days of it, which
      # cannot be re-fetched from anywhere. `docker compose down -v` and
      # `docker system prune --volumes` DESTROY it. See README → "The volume".
      - hedge-data:/data
      # Mounted read-only so the universe, schedule and thresholds can be edited
      # and applied with a restart, no rebuild.
      - ./hedge.config.yaml:/app/hedge.config.yaml:ro
    ports:
      - "127.0.0.1:3500:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/macro').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache is ephemeral: cap memory, evict LRU, no disk persistence.
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --save "" --appendonly no
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # HedgeScope's SQLite database. This is the only durable state in the stack:
  # everything else is fetch-and-cache and rebuilds itself on the next request.
  # IV rank needs 252 days of accumulated daily snapshots, and there is no
  # upstream to re-download them from — once destroyed, the history restarts at
  # zero and IV rank falls back to a realized-volatility proxy for months.
  hedge-data:
