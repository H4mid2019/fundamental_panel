# Fundamental Analysis Dashboard — nginx reverse proxy.
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/,
#   sudo nginx -t && sudo systemctl reload nginx
# The app runs in Docker bound to 127.0.0.1:3500 (see docker-compose.yml).

# Redirect HTTP -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name fundamental.darabi.website;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fundamental.darabi.website;

    ssl_certificate /etc/ssl/certs/darabi.website/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/darabi.website/privkey.pem;
    include /etc/nginx/options-ssl-nginx.conf;

    # Compress the JS/CSS/JSON the app serves.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI brief generation can take ~15-45s on first (uncached) load.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
